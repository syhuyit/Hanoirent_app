spring.application.name=hanoirent-backend
server.port=8080

# Ket noi PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hanoirent_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cau hinh JWT
app.jwt.secret=HanoirentSecureSecretKeyForSigningJwtTokensMustBeAtLeast256BitsLong2026!
app.jwt.expiration-ms=86400000

# Cau hinh Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo}

# Gioi han upload file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB